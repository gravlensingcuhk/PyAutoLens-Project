[project]
name = "pyautolens-project"
version = "0.1.0"
description = "COWLS JWST subhalo project (PyAutoLens SLaM chain)"
readme = "README.md"
# PyAuto >= 2026.10 needs Python >= 3.12; 3.13 matches the HST project's environment.
requires-python = ">=3.13"
dependencies = [
    # On main in the pyauto codespace: pinned PyPI releases.
    "autolens==2026.10.23.1",
    "autonerves==2026.10.23.1",
    # Not on main: vendored branch copies under pyauto/ (see pyauto/PROVENANCE.md).
    "autoarray",
    "autofit",
    "autogalaxy",
    "pyyaml>=6.0.3",
    "scikit-learn<=1.5.1",
    "ipython>=9.10.0",
    "jax>=0.4.38",
    # autoarray's numba fast paths and JAX positive-only solver (not in its base deps).
    "numba",
    "jaxnnls",
]

# GPU (phygpu): `uv sync --extra gpu` installs the CUDA 12 jaxlib. The PyAuto libraries pull in
# CPU-only jax, so without this a sync on a GPU node silently builds a CPU venv. cuda12, not
# cuda13: phygpu's nodes run driver 560 (A6000) / 565 (A800), i.e. CUDA <= 12.6 (HST project
# pyproject). The HTCondor CPU cluster runs a plain `uv sync` and never installs it.
[project.optional-dependencies]
gpu = ["jax[cuda12]; sys_platform == 'linux'"]

[tool.uv.sources]
autoarray = { path = "pyauto/PyAutoArray", editable = true }
autofit = { path = "pyauto/PyAutoFit", editable = true }
autogalaxy = { path = "pyauto/PyAutoGalaxy", editable = true }

[tool.uv]
package = false
